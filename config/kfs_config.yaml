# ============================================================
# KFS 目标检测 — 全局配置文件 (YAML)
# ============================================================
camera:
  type: usb
  usb:
    device: 0
    width: 640
    height: 480
    fps: 60
    fourcc: "MJPG"
  controls:
    auto_exposure: 0      # 0=自动曝光(V4L2:Aperture Priority), 1=手动
    exposure: -1          # 手动曝光值 (仅 manual 模式)
    gain: -1              # -1=不设置
    brightness: 0
    contrast: 50          # V4L2 范围 0~100, 默认 50
    saturation: 64        # V4L2 范围 0~100, 默认 64
    white_balance: -1     # -1=自动白平衡
    sharpness: 50         # V4L2 范围 0~100, 默认 75
model:
  path: models/kfs_yolo11_3class.onnx
  input_size: 640
  conf_threshold: 0.25
  iou_threshold: 0.30
  use_cuda: true          # 是否尝试 CUDA (失败自动回退 CPU)
  class_names: ["R1", "T", "F"]
display:
  debug: true
